    article: Article 5(2)
    quote: It shall not be processed at any later time in a manner incompatible with such purpose. However, it may be processed if the purpose is similar or close to the purpose for which this data is collected
- key: rumour_mandate
  type: unclear_responsibility
  title: No designated authority for public communication on AI-caused outages and rumour rebuttal
  description: False cyberattack rumours spread while the cause is known to the operator; the cyber authority's mandate to issue public rebuttals could not be cited, and rumour law addresses offenders rather
    than official communication.
  absence_queries:
  - official public statement false news crisis authority
  - cybersecurity council public communication incident
  presence_terms: []
  readiness:
  - d7_m01
  - d2_m04
  y3172_nodes:
  - SINK
  - MLFO
  example_query: inform the public about incident significant cyber threat
  global_examples:
  - doc_id: EU-NIS2-2022
    article: Article 23(7)
    quote: may, after consulting the entity concerned, inform the public about the significant incident or require the entity to do so
    how: 'EU: the CSIRT/competent authority may inform the public about a significant incident or require the entity to do so'
    label: NIS2 Art. 23(7)
  - doc_id: EU-EECC-2018
    article: Article 110(1)
    quote: public warnings are transmitted by providers of mobile number-based interpersonal communications services to the end-users concerned
    how: 'EU: public warnings in major emergencies are pushed through mobile operators to affected users'
    label: EECC Art. 110(1)
  recommendation_seed: Designate the authority responsible for timely public communication about AI-caused network incidents, including rebuttal of false cyber-attack attribution, with access to the operator's
    verified incident facts and power to require the operator to inform the public [G1].
  evidence_statement: The rumour law penalises spreading false news (Federal Decree-Law 34/2021 Art. 52); the crisis authority runs a public alert system (Decree-Law 35/2024 Art. 3(8)). No ingested instrument
    gives the cyber authority a mandate to publicly rebut false attribution of a network outage.
  uae_evidence:
  - doc_id: UAE-CYBERCRIME-2021
    article: Article 52(1)
    quote: false news or data, or false, tendentious, misleading or erroneous rumors or reports
  - doc_id: UAE-NCEMA-CDA-2024
    article: Article 3(8)
    quote: Establish a public alert system to warn residents of potential risks
