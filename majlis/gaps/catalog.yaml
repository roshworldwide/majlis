    or consent is required, and which data-governance practices apply to training data [G1].'
  evidence_statement: PDPL Art. 5(2) allows later processing for a 'similar or close' purpose; whether retraining a network model on subscriber location traces qualifies is not addressed specifically in
    the ingested corpus.
