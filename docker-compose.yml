services:
  ollama:
    image: ollama/ollama:latest
    container_name: majlis-ollama
    ports: ["11434:11434"]
    volumes: [ollama_data:/root/.ollama]
  majlis:
    build: .
    container_name: majlis-app
    environment:
      - MAJLIS_OLLAMA_BASE_URL=http://ollama:11434
      - MAJLIS_LLM_MODEL=qwen2.5:3b
      - MAJLIS_ADVISER_MODEL=qwen2.5:7b
    volumes: [./runs:/app/runs, ./results:/app/results]
    depends_on: [ollama]
volumes:
  ollama_data:
