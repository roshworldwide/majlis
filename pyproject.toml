[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "majlis"
version = "0.1.0"
description = "MAJLIS — a mandate-gated multi-agent crisis council for policy gaps in AI-driven telecom networks (ITU AI for Good Lab Hackathon: UAE)"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Roshan Raj" }]
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2",
  "typer>=0.12",
  "rich>=13",
  "httpx>=0.27",
  "pyyaml>=6",
  "chromadb>=0.5,<1.1",
  "rank-bm25>=0.2.2",
  "pymupdf>=1.24",
  "pypdf>=4",
  "beautifulsoup4>=4.12",
  "lxml>=5",
  "numpy>=1.26",
  "scikit-learn>=1.4",
  "matplotlib>=3.8",
  "python-docx>=1.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
majlis = "majlis.cli:app"

[tool.setuptools.packages.find]
include = ["majlis*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
