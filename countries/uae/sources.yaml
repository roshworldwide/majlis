- doc_id: UAE-NCEMA-CDA-2024
  title: "Federal Decree-Law No. (35) of 2024 On the Reorganization of the Civil Defence Authority"
  issuer: "UAE Federal Government (President of the UAE)"
  country: UAE
  doc_type: law
  document_category: UAE_Legislation
  date: "2024-10-01"
  url: "https://uaelegislation.gov.ae/en/legislations/2771"
  fetch_url: "https://web.archive.org/web/20250415091237id_/https://uaelegislation.gov.ae/en/legislations/2771"
  format: html
  language: en
  license_note: "Official public document; portal states 'Copyright 2025 Ministry of Cabinet Affairs. All rights reserved.'; English is a translation, Arabic prevails"
  verified: "Legislation-portal page (snapshot 2025-04-15) with full English text; heading 'Federal Decree-Law No. (35) of 2024 On the Reorganization of the Civil Defence Authority'; metadata: Issued Date 01 Oct 2024, Effective Date 15 Oct 2024, Official Gazette No. 785 dated 14 Oct 2024, Legislation State 'Active' (at snapshot date)."
  notes: "CORRECTION: this is NOT a reorganisation of NCEMA itself - it establishes a Civil Defence Authority (CDA) within NCEMA (Art. 2), with NCEMA replacing the Ministry of Interior's Civil Defence Authority (Art. 2(2)); repeals Federal Law No. (9) of 2004 and No. (23) of 2006 (Art. 16). Pointers: Art. 1 defines NCEMA as 'National Emergency, Crisis and Disaster Management Authority'; Art. 3 CDA competences (21 items); Art. 4 Director General (e.g. recommends to the NCEMA Chairman the announcement of a disaster; sets priority of implementation during emergencies); Art. 5(2) in cases of emergency, disaster and risk the NCEMA Chairman may requisition real estate, movable property, transport; Art. 5(6) in disasters the NCEMA Chairman may oblige entities/professionals to keep workers present to ensure continuation of normal life; Art. 6 cooperation duty - competent (local) authorities and concerned entities must provide CDA with requested information and coordinate; Art. 7 coordination with Armed Forces; Art. 13 penalties (aggravated in disasters); Art. 15 NCEMA Chairman issues implementing regulations. The rendered page omits the preamble, so the NCEMA founding law could not be verified from this text. Search results (not verified) indicate Federal Decree-Law No. (8) of 2025 created a 'Federal Authority for Ambulance and Civil Defence' superseding this CDA (portal id 3231; 403, no snapshot) - check status before relying on it."

