- doc_id: UAE-TELECOM-LAW
  title: "Federal Decree-Law No. (3) of 2003 Regulating Telecommunications"
  issuer: "UAE Federal Government (President of the UAE); regulator: Telecommunications and Digital Government Regulatory Authority (TDRA)"
  country: UAE
  doc_type: law
  document_category: UAE_Legislation
  date: "2003-11-15"
  url: "https://uaelegislation.gov.ae/en/legislations/1132/download"
  fetch_url: "https://web.archive.org/web/20250529093130id_/https://uaelegislation.gov.ae/en/legislations/1132/download"
  format: pdf
  language: en
  license_note: "Official public document; redistribution terms not stated (official English translation; Arabic text prevails)"
  verified: "34-page consolidated English text from the UAE Legislation portal; heading 'Federal Decree-Law No. (3) of 2003 Regulating Telecommunications'; signed 'Issued by Us at the Presidential Palace in Abu Dhabi, On: 20 Ramadan 1424 A.H., Corresponding: 15 November 2003 AD'; repealed articles marked '(Repealed by Federal Decree-Law No. 5 of 2008)'; regulator named 'The General Authority for Regulating the Telecommunications Sector and the Digital Government' (post-2020 name)."
  notes: "Consolidated text (PDF created 2024-10-03). Pointers: Art. 2-3 High Committee overseeing the sector (policy; directives 'in the interest of national security or international relations'; licences); Art. 10 Board of Directors competences (implementing regulations, sector policy, national-security directives after Cabinet approval, issue/suspend licences); Art. 13 Authority objectives (quality and efficient services; Licensees comply with performance quality standards); Art. 14 Authority solely responsible for regulations on interconnection, service terms and quality assurance standards (para 3), equipment, numbering, spectrum (para 7), and digital-government functions (paras 13-21, incl. para 19 coordination on readiness to address risks and threats); Art. 46 Coordination Committee on spectrum (Armed Forces, Ministry of Interior, State Security Service, National Media Council); Part Nine (Art. 71-80) penalties. The English text contains NO occurrence of 'emergency' or 'disaster', NO outage/incident-reporting duty and NO provision on AI/automated network operation or validation of AI/ML model updates; such duties would sit in licences/TDRA regulations. Alternative official edition: TDRA consolidated 2022 English booklet 'Federal Law by Decree No. (3) of 2003 regarding the Organization of the Telecommunications Sector, as amended' (https://u.ae/-/media/Resources/TDRA-telecom-law_Final_english_o.pdf, snapshot https://web.archive.org/web/20250929185143id_/https://u.ae/-/media/Resources/TDRA-telecom-law_Final_english_o.pdf) - downloaded and verified (47 pp., footnotes cite amendments by Federal Law by Decree No. (5) of 2008 and No. (23) of 2020), but only pp. 1-12 have extractable text (rest outlined; needs OCR)."

- doc_id: UAE-PDPL-2021
  title: "Federal Decree by Law No. (45) of 2021 Concerning the Protection of Personal Data"
