  format: pdf
  language: en
  license_note: "Official public document; redistribution terms not stated (official English translation; Arabic text prevails)"
  verified: "29-page English text; heading 'Federal Decree by Law No. (45) of 2021 Concerning the Protection of Personal Data'; 'Issued by us at the Presidency Palace in Abu Dhabi: On: 13 Safar 1443 AH, Corresponding: 20 September 2021AD'; Art. 31 in force as of 02 January 2022."
  notes: "Pointers: Art. 2(1) territorial scope; Art. 2(2) exclusions (government data and governmental entities, security/judicial authorities, health data and banking/credit data with own legislation, free-zone entities with own data-protection law); Art. 3 Bureau power of exemption; Art. 4 processing without consent (public interest, public health, protecting the data subject's interests, legal obligations, etc.); Art. 5 processing controls; Art. 6 consent conditions; Art. 7-8 controller/processor obligations; Art. 9 breach notification - controller notifies the Bureau and the data subject within the period set by the Executive Regulations, processor notifies controller as soon as aware; Art. 10-12 DPO; Art. 18 right to object to automated decisions incl. profiling, with human review on request (Art. 18(4)); Art. 20 security of processing; Art. 21 data protection impact assessment; Art. 22-23 cross-border transfer (adequate protection / exceptions); Art. 24 complaints to the Bureau; Art. 26 administrative penalties; Art. 28 Executive Regulation by Cabinet. Breach deadline delegated to Executive Regulations (not verified whether issued). No AI-specific incident notification or model-validation provision. Official Arabic edition also on government.ae (not fetched: TLS hostname mismatch)."

