  notes: >-
    legislation.gov.uk answered automated curl with HTTP 202 and an empty body (bot check), so the file came from the Internet Archive snapshot
    (20260729035445) of the official PDF URL. Inserts into the Communications Act 2003: s.105A Duty to take security measures (identify, reduce,
    prepare for 'security compromises'); s.105A(2) defines 'security compromise' incl. '(a) anything that compromises the availability, performance
    or functionality of the network or service'; s.105B specified security measures (regulations); s.105C duty to take measures in response to
