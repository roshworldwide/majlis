  license_note: "not stated"
  verified: "Scanned 4-page PDF (OCR text): 'TELECOM REGULATORY AUTHORITY OF INDIA ... DIRECTION Subject: Direction under section 13 ... regarding reporting of major network outages to TRAI'; signed '(Tejpal Singh) Advisor (QoS-I)'; addressed 'To All Telecom Service Providers (TSPs) (including BSNL and MTNL)'. The day in the printed date did not OCR cleanly ('Dated: __ March, 2023'). 28 March comes from the file name and the PDF CreationDate (2023-03-28)."
  notes: >-
