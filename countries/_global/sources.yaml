    significance judged by (a) duration, (b) number of users affected, (c) size and location of the geographical area, (d) extent activities of users
    are affected; s.105L OFCOM powers to inform others; s.105M-105V OFCOM compliance, assessment and enforcement; s.105W civil liability.
    No fixed hour deadline is printed in s.105K.

