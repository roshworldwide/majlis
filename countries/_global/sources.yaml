  format: pdf
  language: en
  license_note: "Government of India Gazette publication; reuse terms not stated"
  verified: "Gazette of India Extraordinary, Part II Sec. 3(i), bilingual Hindi/English, 13 pages: 'MINISTRY OF COMMUNICATIONS (Department of Telecommunications) NOTIFICATION New Delhi, the 21st November, 2024. G.S.R. 720(E)'; rule 1 'These rules may be called the Telecommunications (Telecom Cyber Security) Rules, 2024'; made under s.22(1) read with s.56(2)(v) of the Telecommunications Act, 2023; draft was G.S.R. 520(E) of 28 August 2024."
  notes: >-
    Copy from the official DoT eServices portal (linked from https://eservices.dot.gov.in/telecom-cyber-security). The dot.gov.in copy found by search
    ('Gazette Notification of Telecommunications (Telecom Cyber Security) Rules, 2024.pdf') returned 404 on 2026-11-10.
    Rule 2(1)(e) '"security incident" means an event having real or potential risk on telecom cyber security'.
    Rule 6 Chief Telecommunication Security Officer, who must be 'a citizen and resident of India' and responsible to the Board.
    Rule 7 Reporting of security incidents: 7(1)(a) 'within six hours of becoming aware of a security incident affecting its telecommunication network
    or telecommunication service, report the same to the Central Government with relevant details of the affected system including the description of
    such incident'; 7(1)(b) 'within twenty-four hours of becoming aware of such incident' furnish (i) number of users affected, (ii) duration,
    (iii) geographical area affected, (iv) extent the network or service is affected, (v) remedial measures taken or proposed, (vi) other relevant
    information. 7(2) the Government may inform the public; 7(3) it may require information or a security audit by a certified agency; 7(4) it may
    issue remedial directions with time limits. Amended by G.S.R. 771(E) of 22 October 2025 (next entry), which does not change rule 7.

