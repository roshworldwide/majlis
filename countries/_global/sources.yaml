- doc_id: EU-AIACT-2024
  title: "Regulation (EU) 2024/1689 of the European Parliament and of the Council of 13 June 2024 laying down harmonised rules on artificial intelligence and amending Regulations (EC) No 300/2008, (EU) No 167/2013, (EU) No 168/2013, (EU) 2018/858, (EU) 2018/1139 and (EU) 2019/2144 and Directives 2014/90/EU, (EU) 2016/797 and (EU) 2020/1828 (Artificial Intelligence Act)"
  issuer: "European Parliament and Council of the European Union"
  country: EU
  doc_type: regulation
  document_category: Global_Examples
  date: "2024-06-13"
  url: "http://data.europa.eu/eli/reg/2024/1689/oj"
  fetch_url: "http://publications.europa.eu/resource/celex/32024R1689"
  format: pdf
  language: en
  license_note: "EU legal texts: reuse authorised under Commission Decision 2011/833/EU (acknowledge source)"
  verified: "PDF header 'Official Journal of the European Union, L series, 2024/1689, 12.7.2024'; title 'REGULATION (EU) 2024/1689 ... of 13 June 2024 ... (Artificial Intelligence Act)'; footer 'ELI: http://data.europa.eu/eli/reg/2024/1689/oj'; 144 pages. Original OJ text, not a consolidated version, so later amendments are not included."
  notes: >-
    Fetch with headers 'Accept: application/pdf' and 'Accept-Language: en'; redirects to the cellar DOC_1 PDF. EUR-Lex HTML
    (https://eur-lex.europa.eu/eli/reg/2024/1689/oj) returns a 202 challenge to automated clients.
    Annex III point 2: 'Critical infrastructure: AI systems intended to be used as safety components in the management and operation of critical
    digital infrastructure, road traffic, or in the supply of water, gas, heating or electricity.'
    Art. 3(23) 'substantial modification'; Art. 3(49) 'serious incident', where point (b) is 'a serious and irreversible disruption of the
    management or operation of critical infrastructure'.
    Art. 9 Risk management system; Art. 12 Record-keeping; Art. 14 Human oversight; Art. 15 Accuracy, robustness and cybersecurity;
    Art. 19(1) providers keep automatically generated logs 'of at least six months'; Art. 26 Obligations of deployers: 26(2) assign human oversight
    to competent natural persons, 26(5) deployers that identify a serious incident 'shall also immediately inform first the provider, and then the
    importer or distributor and the relevant market surveillance authorities', 26(6) deployers keep logs 'of at least six months'.
    Art. 57 AI regulatory sandboxes; Art. 72 Post-market monitoring by providers and post-market monitoring plan.
    Art. 73 Reporting of serious incidents: 73(2) 'immediately after the provider has established a causal link ... and, in any event, not later than
    15 days after the provider or, where applicable, the deployer, becomes aware of the serious incident'; 73(3) for 'a widespread infringement or
    a serious incident as defined in Article 3, point (49)(b)' (critical infrastructure disruption): 'immediately, and not later than two days after
    the provider or, where applicable, the deployer becomes aware of that incident'; 73(4) death of a person: 'not later than 10 days';
    73(5) an incomplete initial report may be followed by a complete report; 73(8) market surveillance authority acts 'within seven days'.
    Art. 113 application dates: generally 2 August 2026; Chapters I-II from 2 February 2025; Art. 6(1) obligations from 2 August 2027.

- doc_id: EU-NIS2-2022
  title: "Directive (EU) 2022/2555 of the European Parliament and of the Council of 14 December 2022 on measures for a high common level of cybersecurity across the Union, amending Regulation (EU) No 910/2014 and Directive (EU) 2018/1972, and repealing Directive (EU) 2016/1148 (NIS 2 Directive)"
  issuer: "European Parliament and Council of the European Union"
  country: EU
  doc_type: directive
  document_category: Global_Examples
  date: "2022-12-14"
  url: "https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32022L2555"
  fetch_url: "http://publications.europa.eu/resource/celex/32022L2555"
  format: pdf
  language: en
  license_note: "EU legal texts: reuse authorised under Commission Decision 2011/833/EU (acknowledge source)"
  verified: "PDF header 'L 333/80 ... Official Journal of the European Union 27.12.2022'; title 'DIRECTIVE (EU) 2022/2555 ... of 14 December 2022 ... (NIS 2 Directive)'."
  notes: >-
    Fetch with headers 'Accept: application/pdf' and 'Accept-Language: en'. EUR-Lex returns a 202 challenge to automated clients.
    Art. 21 Cybersecurity risk-management measures: 21(1) appropriate and proportionate technical, operational and organisational measures;
    21(2) 'all-hazards approach' with minimum measures incl. (b) incident handling, (c) business continuity ... and crisis management,
    (d) supply chain security, (e) security in acquisition, development and maintenance.
    Art. 23 Reporting obligations: 23(3) significant incident = caused or capable of causing 'severe operational disruption of the services or
    financial loss', or affecting others by 'considerable material or non-material damage'. 23(4): (a) early warning 'without undue delay and in
    any event within 24 hours of becoming aware of the significant incident'; (b) incident notification 'without undue delay and in any event within
    72 hours of becoming aware'; (c) intermediate report on request; (d) final report 'not later than one month after the submission of the incident
    notification'; (e) if ongoing, progress report then final report 'within one month of their handling of the incident'. 23(1): notify recipients
    of the service 'without undue delay' where appropriate.
    Annex I, sector 8 'Digital infrastructure' lists 'Providers of public electronic communications networks' and 'Providers of publicly available
    electronic communications services'.
    Art. 43: 'In Directive (EU) 2018/1972, Articles 40 and 41 are deleted with effect from 18 October 2024.' Art. 41: transpose by 17 October 2024,
    apply from 18 October 2024.

