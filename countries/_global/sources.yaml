  fetch_url: "https://www.oecd.org/content/dam/oecd/en/publications/reports/2025/02/towards-a-common-reporting-framework-for-ai-incidents_8c488fdb/f326d4ac-en.pdf"
  format: pdf
  language: en
  license_note: "© OECD 2025; Creative Commons Attribution 4.0 International (CC BY 4.0), as stated in the document"
  verified: "PDF cover 'TOWARDS A COMMON REPORTING FRAMEWORK FOR AI INCIDENTS, OECD ARTIFICIAL INTELLIGENCE PAPERS, February 2025 No. 34'; '© OECD 2025'. Title and year as briefed are correct."
  notes: >-
    `url` (landing page) was found by web search and not fetched; the PDF was downloaded and verified.
    Box 1.1 definitions: 'An AI incident is an event, circumstance or series of events where the development, use or malfunction of one or more AI
    systems directly or indirectly leads to' harms incl. '(b) disruption of the management and operation of critical infrastructure'; 'An AI hazard'
    is one that 'could plausibly lead to an AI incident'. 88 potential criteria were reviewed and '29 criteria for a common reporting framework' kept
    (Table 2.2; Annex B Table B.1), incl. harm type 'public interest/critical infrastructure'. Reviewed by the OECD.AI Expert Group on AI Incidents
    (2024), AIGO (June 2024) and GPAI (November 2024 Plenary).

