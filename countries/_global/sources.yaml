  headers: {Accept: "application/pdf;type=pdfa1a", Accept-Language: "en"}
  format: pdf
  language: en
  license_note: "EU legal texts: reuse authorised under Commission Decision 2011/833/EU (acknowledge source)"
  verified: "PDF header 'L 321/36 ... Official Journal of the European Union 17.12.2018'; title 'DIRECTIVE (EU) 2018/1972 ... of 11 December 2018 establishing the European Electronic Communications Code (Recast)'. Original OJ text (not consolidated)."
  notes: >-
    Header 'Accept: application/pdf' returns 404 for this act; use 'Accept: application/pdf;type=pdfa1a' plus 'Accept-Language: en'
    ('Accept: application/xhtml+xml' also works and returns XHTML). The EUR-Lex `url` was not fetched (challenge page for automated clients).
    Art. 40 Security of networks and services: 40(1) appropriate and proportionate technical and organisational measures; 40(2) notify the competent
    authority 'without undue delay' of a security incident 'that has had a significant impact on the operation of networks or services', judged by
    (a) number of users affected, (b) duration, (c) geographical spread, (d) extent the network or service is affected, (e) impact on economic and
    societal activities. Arts 40-41 deleted from 18 October 2024 by NIS2 Art. 43 (see EU-NIS2-2022).
    Art. 108 Availability of services: providers of voice communications services 'shall take all necessary measures to ensure uninterrupted access
    to emergency services and uninterrupted transmission of public warnings'.
    Art. 109 Emergency communications and the single European emergency number '112': 109(2) access to emergency services 'to the most appropriate
    PSAP'; 109(3) emergency communications 'appropriately answered and handled'.

