  fetch_url: "https://www.trai.gov.in/sites/default/files/2024-09/Recommendation_20072023.pdf"
  format: pdf
  language: en
  license_note: "not stated"
  verified: "Cover 'Telecom Regulatory Authority of India Recommendations on Leveraging Artificial Intelligence and Big Data in Telecommunication Sector 20th July 2023'; 141 pages; Chapter 4 'LIST OF RECOMMENDATIONS'."
  notes: >-
    4.1 urgent need for a cross-sector regulatory framework where 'specific AI use cases are regulated on a risk-based framework where high risk use
    cases that directly impact humans are regulated through legally binding obligations' (Para 2.124). 4.2 tenets: independent statutory authority;
    Multi Stakeholder Body (MSB); risk-based categorisation of use cases (Para 2.125). 4.3 establish 'Artificial Intelligence and Data Authority of India'
    (AIDAI) (Para 2.126). 4.6 AIDAI functions incl. 'Setting up regulatory sandboxes for testing AI based solutions'. 4.14 DoT research with IISc,
    IITs on indigenous telecom AI use cases (Para 3.41). 4.20 NTIPRIT courses on ethical use of AI (Para 3.88). Preceded by the TRAI consultation
    paper of 5 August 2022 (https://www.trai.gov.in/sites/default/files/2024-09/CP_05082022.pdf, found by search, not downloaded).

