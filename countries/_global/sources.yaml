- doc_id: IN-TRAI-AIGUIDE-DRAFT-2026
  title: "Draft Guidelines on Responsible Use of Artificial Intelligence (AI) in Telecommunication Networks and Provision of Telecommunication Services (Draft Guidelines for Consultation)"
  issuer: "Telecom Regulatory Authority of India (TRAI)"
  country: IN
  doc_type: guideline
  document_category: Global_Examples
  date: "2026-10-30"
  url: "https://trai.gov.in/sites/default/files/2026-10/Draft_CP_30102026.pdf"
  fetch_url: "https://trai.gov.in/sites/default/files/2026-10/Draft_CP_30102026.pdf"
  format: pdf
  language: en
  license_note: "not stated"
  verified: "Cover 'Draft Guidelines for Consultation, Telecom Regulatory Authority of India, Draft Guidelines on Responsible Use of Artificial Intelligence (AI) in Telecommunication Networks and Provision of Telecommunication Services, New Delhi, India, 30.10.2026'; 'Written comments on the draft guidelines are invited from stakeholders by 27.11.2026'; 12 pages."
  notes: >-
    DRAFT for consultation, not in force. Found through web search of trai.gov.in, downloaded and read in full. Grounded in the Government of India
    'India AI Governance Guidelines' (Feb 2026, para 1.1). Para 1.3 names model drift, adversarial attacks and lack of 'due supervision ... over
    autonomous learning' as risks to telecom resilience.
    2.1 Applies to licensees/authorised entities 'using or intending to use AI system(s) in telecommunication networks, or provision of telecommunication
    services'.
    3.1-3.4 Board-approved 'Internal AI policy on telecom': high/medium/low risk classification by materiality; use only after approval by a designated
    officer; AI incidents classed critical/high/moderate/low severity; central incident database; 'Critical severity AI incidents and high severity AI
    incidents shall be informed to TRAI in a prescribed format, manner and timeframe'; human oversight; data governance; grievance redressal; review at
    least once a financial year; file the policy with TRAI 'within seven working days'.
    3.5 implementation: AI inventory ('No AI system shall be used unless it is a part of the inventory'); third-party due diligence; (c) 'validation,
    conformity assessment, and impact assessment before deployment of any new AI system or modification of an existing AI system' covering accuracy,
    robustness, explainability, fairness, drift resilience and human oversight (TEC 57050:2023 for fairness); (e) supplier disclosure of embedded AI;
    (f) enforceable supplier clauses on 'audit and inspection rights, incident management, risk allocation and accountability'; (g) AI incident database
    using 'TEC standard 57090:2025 on Schema and Taxonomy of an AI Incident Database in Telecommunications and Critical Digital Infrastructure';
    (h) SOP-based mitigation; (k) training for staff involved in human oversight.
    3.6-3.7 AI Governance and Safety Committee (AGSC) headed by an AI Governance and Safety Officer (AGSO); annual review; corrective measures including
    decommissioning. 3.8 entity 'accountable for the outcome of all AI systems used by it' whether built in-house or procured. 3.9 report critical- and
    high-severity AI incidents 'including material malfunctions, recurring failures, and mitigation measures to TRAI in a prescribed form, manner, and
    timeframe'. The draft sets no hour or day deadline. Definitions: 'AI Incident means an event where an AI system malfunctions, produces unintended
    outcomes, or behaves unpredictably, potentially causing harm or violating legal rights'; 'Resilient AI system' must 'degrade safely and gracefully'.

