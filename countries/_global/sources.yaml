- doc_id: US-47CFR-PART4
  title: "47 CFR Part 4 - Disruptions to Communications"
  issuer: "Federal Communications Commission (eCFR, Office of the Federal Register / GPO)"
  country: US
  doc_type: regulation
  document_category: Global_Examples
  date: "2026-11-05"
  url: "https://www.ecfr.gov/current/title-47/chapter-I/subchapter-A/part-4"
  fetch_url: "https://www.ecfr.gov/api/versioner/v1/full/2026-11-05/title-47.xml?part=4"
  format: xml
  language: en
  license_note: "US federal government work; public domain"
  verified: "eCFR XML root <HEAD>PART 4—DISRUPTIONS TO COMMUNICATIONS</HEAD>; Source '69 FR 70338, Dec. 3, 2004'; sections 4.1-4.18 present. Date = eCFR title 47 latest_issue_date (titles.json, up to date as of 2026-11-06). The §4.9 amendment history ends '89 FR 2513, Jan. 16, 2024'."
  notes: >-
    The eCFR API requires compression: use curl --compressed (sends Accept-Encoding). Without it the API returns HTTP 406.
    The `url` is the standard eCFR reader path for this part (not fetched).
    §4.5(a) outage = 'a significant degradation in the ability of an end user to establish and maintain a channel of communications as a result of
    failure or degradation in the performance of a communications provider's network'. §4.5(e) outage potentially affecting a 911 special facility
    (e.g. loss of communications to PSAP(s) potentially affecting at least 900,000 user-minutes and lasting 30 minutes or more; loss of 911 call
    processing in E-911 tandems/selective routers for at least 30 minutes; loss of ANI/ALI or location determination equipment for at least
    30 minutes and 900,000 user-minutes). §4.5(f) 988 special facility.
    §4.9 thresholds and deadlines (cable, satellite, wireless, wireline): Notification to the FCC 'within 120 minutes of discovering' an outage of
    at least 30 minutes duration meeting the thresholds; Initial Communications Outage Report 'Not later than 72 hours after discovering the outage';
    Final Communications Outage Report 'Not later than 30 days after discovering the outage'. Wireless §4.9(e)(1): MSC outage; at least
    900,000 user minutes; at least 667 OC3 minutes. §4.9(e)(2) users affected by a switch failure = macro cell sites disabled x average users per site.
    Interconnected VoIP §4.9(g): 'Within 240 minutes' for an outage potentially affecting a 911 or 988 special facility; 'Within 24 hours' for
    900,000 user minutes with complete loss of service; Final report 'Not later than thirty days'.
    §4.9(h) 911 special facility outage notification (cable, satellite, wireless, wireline, interconnected VoIP and covered 911 service providers):
    (1) annually confirm contact information; (2) convey all available material information; (3) 'by telephone and in writing via electronic means';
    (4) initial notification 'as soon as possible, but no later than within 30 minutes of discovering' the outage; (5) first follow-up 'no later than
    two hours after the initial contact', then updates until service is fully restored. §4.9(i) same model for 988 special facilities.
    §4.11 form of notification and reports (NORS); §4.18 DIRS.

- doc_id: US-47CFR-9-19
  title: "47 CFR 9.19 - Provision of reliable 911 service"
  issuer: "Federal Communications Commission (eCFR, Office of the Federal Register / GPO)"
  country: US
  doc_type: regulation
  document_category: Global_Examples
  date: "2026-11-05"
  url: "https://www.ecfr.gov/current/title-47/section-9.19"
  fetch_url: "https://www.ecfr.gov/api/versioner/v1/full/2026-11-05/title-47.xml?part=9&section=9.19"
  format: xml
  language: en
  license_note: "US federal government work; public domain"
  verified: "eCFR XML <HEAD>§ 9.19 Provision of reliable 911 service.</HEAD>, citation '47 CFR 9.19'; history '[84 FR 66760, Dec. 5, 2019, as amended at 88 FR 9765, Feb. 15, 2023; 91 FR 1403, Jan. 14, 2026; 91 FR 42841, July 10, 2026]'."
  notes: >-
    Use curl --compressed (the eCFR API returns 406 without compression). The `url` is the standard eCFR reader path (not fetched).
    §9.19(a)(4) covered 911 service provider (911, E911 or NG911 services 'for which a failure would impede the real-time routing, delivery, or
    transfer of 911 traffic'). §9.19(b) take 'reasonable measures to provide reliable 911 service that ensures physical diversity, operational
    integrity, and network monitoring'. §9.19(c) benchmarks: (1) physical diversity (IP paths may use automatic rerouting, load balancing,
    geographically distributed routing; legacy circuits 'yearly diversity audits'); (2) operational integrity (backup power 'at least 24 hours'
    for a central office directly serving a PSAP and 'at least 72 hours' for one hosting a selective router; NG911 elements 'uninterruptible and
    continuous power supply and automatic switchover to geographically diverse backup facilities'); (3) network monitoring ('geographically distributed
    automatic disruption detection and alarm systems'). §9.19(d) some compliance dates are '18 months from the date of issuance of a Public Notice'.
    This text reflects the 2026 amendments (91 FR 1403; 91 FR 42841).

